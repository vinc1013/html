<!DOCTYPE html>

    <title>個人報名</title>

        <label for="name">姓名/Name</label>

        <span>性別/Gender</span>

        <label>

        <label>

        <input type="email" name="email" id="email"

        placeholder="example@mail.com"

        <br><br>

        </select>
        <input type="text" name="address" id="address"
        pattern="[0-9]{3}"
        placeholder="郵遞區號"
        >
        <input type="text" name="address" id="address"
        placeholder="例如:昌吉街55樓2號206室"
        >
        <br><br>
        <label for="contact">緊急聯絡人姓名/Name of Emergency Contact</label>
        <input type="text" name="contact" id="contact">
        <label for="contact">關係/Relationshop</label>
        <input type="text" name="contact" id="contact">
        <label for="contact">電話/Phone</label>
        <input type="tel" name="contact" id="contact">

   </section>
   <section>
    <fieldset>
        <legend>競賽項目資料/Race Category Information</legend>
       <br>
        <label>
            <input type="checkbox" name="race" id="9KM">
            9KM (NTD 800)
        </label>
        <select name="race" id="9KM">
            <option value=" ">請選擇衣服尺寸</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
        </select>
        <br><br>
        <label>
            <input type="checkbox" name="race" id="3KM">
            3KM (NTD 650)
        </label>
        <select name="race" id="3KM">
            <option value=" ">請選擇衣服尺寸</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
        </select>
        <br><br> 
    </fieldset>
   </section>
   <section>
    <fieldset>
        <legend>報導方式(二擇一)/Check-in Method</legend>
        <br>
        <span>郵寄代理報到 / Postal delivery check-in</span>
        <label>
            <input type="radio" name="Postal delivery" id="Y">
            是 / Y(需額外付費，限台灣本島)
        </label>
        <label>
            <input type="radio" name="Postal delivery" id="N">
            否/N
        </label>
        <br><br>
        <label>
            <input type="radio" name="check-in" id="check-in">
            地點:花博爭艷館(臺北市中山區玉門街1號)
        </label>
        <label>
            時間 :
            <input type="date" name="cho-date" id="check-in">
        </label>
        <label>
            ~
            <input type="date" name="cho-date" id="check-in">
        </label>
        <br><br>
    </fieldset>
   </section>
   <section>
    <fieldset>
        <legend>其他/Other</legend>
        <br>
        <form action="">
        <label for="Website">個人網站 /Website(選填)</label>
        <input type="url" name="Website" id="Website"
        placeholder="https://"
        >
        <br><br>
        <label for="note">備註 / Note</label>
        <textarea id="note" 
        rows="8"
        cols="30"
        placeholder="如有需求請於此回覆"
        maxlength="100"
        >
        </textarea>
        <br><br>
        <label for="flie">上傳證件照 / Upload Photo</label>
        <input type="file" name="flie" id="flie">
        <br><br>
    </fieldset>
    <br>
    <input type="submit" name="action" value="送出報名" class="sub-btu">
    <input type="reset" name="reset" value="清除重填" class="res-btu">
    </form>
   </section>
